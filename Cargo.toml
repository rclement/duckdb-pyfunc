[package]
name = "duckdb_pyfunc"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension for Python UDFs defined in SQL"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
name = "duckdb_pyfunc"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb = { version = "=1.4.3", features = ["vtab-loadable"] }
duckdb-loadable-macros = "=0.1.13"
libduckdb-sys = { version = "=1.4.3", features = ["loadable-extension"] }
pyo3 = { version = "0.23", features = ["auto-initialize"] }
once_cell = "1.19"
parking_lot = "0.12"
